Serilog:
  Using:
    - Serilog.Sinks.Console
    - Serilog.Sinks.File
    - Serilog.Sinks.Async

  MinimumLevel:
    Default: Debug
    Override:
      Microsoft: Warning
      System: Warning
      Quartz: Warning

  WriteTo:
    - Name: Async
      Args:
        configure:
          - Name: Console
            Args:
              restrictedToMinimumLevel: Information
              outputTemplate: "[{Timestamp:yyyy-MM-dd HH:mm:ss} {Level:u3}] [{SourceContext}] {Message:lj}{NewLine}{Exception}"
          - Name: File
            Args:
              restrictedToMinimumLevel: Information
              path: "logs/application-.log"
              rollingInterval: Day
              retainedFileCountLimit: 14
              outputTemplate: "[{Timestamp:yyyy-MM-dd HH:mm:ss.fff zzz} {Message:lj}{NewLine}"

fileIgnorePatterns:
    - ".DS_Store"
    - ".AppleDouble"
    - ".LSOverride"
    - "._*"
    - ".Spotlight-V100"
    - ".Trashes"
    - ".fseventsd"
    - "Thumbs.db"
    - "ehthumbs.db"
    - "Desktop.ini"
    - "desktop.ini"
    - ".directory"
    - ".Trash-*"
